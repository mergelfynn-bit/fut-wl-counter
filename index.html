<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUT WL Counter</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

/* NORMALE OBS-QUELLE */
body:not(.control) {
    background: transparent;
}

/* OBS CONTROL DOCK */
body.control {
    background: #202020;
    color: white;
}

.counter {
    width: 276px;
    height: 146px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;
}

/* DOCK */
body.control .counter {
    width: 100%;
    height: 100%;

    min-width: 260px;
    min-height: 140px;

    background: #202020;
}

/* ZAHLEN-BEREICH */

.side {
    width: 80px;
    height: 120px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.number {
    font-size: 58px;
    font-weight: 900;
    color: white;

    text-shadow: 0 2px 4px black;

    transition: transform .1s;
}

body.control .side:hover .number {
    transform: scale(1.1);
}

/* LOGO */

.logo-container {
    width: 75px;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.champs-logo {
    width: 65px;
    height: 85px;

    object-fit: contain;

    display: block;
}

body.control .logo-container:hover .champs-logo {
    transform: scale(1.08);
}

/* DOCK BESCHRIFTUNG */

.control-label {
    display: none;
}

body.control .control-label {
    display: block;

    position: absolute;

    top: 5px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 11px;
    font-weight: bold;

    color: #aaa;
}

</style>
</head>

<body>

<div class="control-label">
    FUT CHAMPIONS COUNTER
</div>

<div class="counter">

    <!-- WINS -->

    <div
        class="side"
        id="winsButton"
        title="Linksklick = +1 | Rechtsklick = -1"
    >
        <div
            class="number"
            id="wins"
        >0</div>
    </div>


    <!-- LOGO -->

    <div
        class="logo-container"
        id="resetButton"
        title="Klick = Zurücksetzen"
    >

        <img
            class="champs-logo"
            src="assets/img/champions-only.png"
            alt="FUT Champions"
            draggable="false"
        >

    </div>


    <!-- LOSSES -->

    <div
        class="side"
        id="lossesButton"
        title="Linksklick = +1 | Rechtsklick = -1"
    >
        <div
            class="number"
            id="losses"
        >0</div>
    </div>

</div>


<script>

/* ========================================
   CONTROL MODE
======================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const control =
    params.get("control") === "1";

if (control) {

    document.body.classList.add("control");

}


/* ========================================
   ELEMENTE
======================================== */

const wins =
    document.getElementById("wins");

const losses =
    document.getElementById("losses");

const winsButton =
    document.getElementById("winsButton");

const lossesButton =
    document.getElementById("lossesButton");

const resetButton =
    document.getElementById("resetButton");


/* ========================================
   STORAGE
======================================== */

const STORAGE =
    "fut-wl-counter";

let state = {

    wins: 0,
    losses: 0

};


/* ========================================
   LADEN
======================================== */

function load() {

    try {

        const saved =
            localStorage.getItem(STORAGE);

        if (saved) {

            const data =
                JSON.parse(saved);

            state.wins =
                Number(data.wins) || 0;

            state.losses =
                Number(data.losses) || 0;

        }

    } catch (e) {

        console.log(e);

    }

    render();

}


/* ========================================
   SPEICHERN
======================================== */

function save() {

    localStorage.setItem(
        STORAGE,
        JSON.stringify({
            wins: state.wins,
            losses: state.losses
        })
    );

}


/* ========================================
   RENDER
======================================== */

function render() {

    wins.textContent =
        state.wins;

    losses.textContent =
        state.losses;

}


/* ========================================
   WINS +1
======================================== */

winsButton.addEventListener(
    "click",
    function() {

        if (!control)
            return;

        if (state.wins < 20) {

            state.wins++;

            save();
            render();

        }

    }
);


/* ========================================
   WINS -1
======================================== */

winsButton.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

        if (!control)
            return;

        if (state.wins > 0) {

            state.wins--;

            save();
            render();

        }

    }
);


/* ========================================
   LOSSES +1
======================================== */

lossesButton.addEventListener(
    "click",
    function() {

        if (!control)
            return;

        if (state.losses < 20) {

            state.losses++;

            save();
            render();

        }

    }
);


/* ========================================
   LOSSES -1
======================================== */

lossesButton.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

        if (!control)
            return;

        if (state.losses > 0) {

            state.losses--;

            save();
            render();

        }

    }
);


/* ========================================
   RESET
======================================== */

resetButton.addEventListener(
    "click",
    function() {

        if (!control)
            return;

        state.wins = 0;
        state.losses = 0;

        save();
        render();

    }
);


/* ========================================
   STORAGE SYNC
======================================== */

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key === STORAGE
        ) {

            load();

        }

    }
);


/* ========================================
   ZUSÄTZLICHE SYNCHRONISATION
======================================== */

setInterval(
    function() {

        if (!control) {

            load();

        }

    },
    200
);


/* ========================================
   START
======================================== */

load();

</script>

</body>
</html>
