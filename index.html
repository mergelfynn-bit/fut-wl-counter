<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUT Champions W/L Counter</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
    }

    .counter {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 400px;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
    }

    /* =========================
       LOGO
    ========================= */

    .logo {
        position: absolute;
        left: 50%;
        top: 50%;

        width: 180px;
        height: 180px;

        transform: translate(-50%, -50%);

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;
        z-index: 10;
    }

    .logo img {
        width: 100%;
        height: 100%;

        object-fit: contain;

        display: block;

        pointer-events: none;
    }

    /* =========================
       ZAHLEN
    ========================= */

    .score {
        position: absolute;

        top: 50%;

        transform: translateY(-50%);

        color: white;

        font-size: 76px;
        font-weight: 900;

        line-height: 1;

        cursor: pointer;

        z-index: 20;

        text-shadow:
            0 3px 5px rgba(0, 0, 0, 1),
            0 0 10px rgba(0, 0, 0, .9);
    }

    .wins {
        right: calc(50% + 145px);
    }

    .losses {
        left: calc(50% + 145px);
    }

    /* =========================
       KLEINE BESCHRIFTUNG
    ========================= */

    .label {
        position: absolute;

        top: calc(50% + 48px);

        color: rgba(255,255,255,.8);

        font-size: 13px;
        font-weight: 800;

        letter-spacing: 2px;

        pointer-events: none;

        z-index: 20;

        text-shadow:
            0 2px 4px rgba(0,0,0,1);
    }

    .wins-label {
        right: calc(50% + 153px);
    }

    .losses-label {
        left: calc(50% + 153px);
    }

    /* =========================
       HOVER
    ========================= */

    .score:hover {
        transform: translateY(-50%) scale(1.08);
    }

    .logo:hover {
        transform: translate(-50%, -50%) scale(1.05);
    }

    /* =========================
       KLEINE SCREENS
    ========================= */

    @media (max-width: 700px) {

        .logo {
            width: 130px;
            height: 130px;
        }

        .score {
            font-size: 55px;
        }

        .wins {
            right: calc(50% + 105px);
        }

        .losses {
            left: calc(50% + 105px);
        }

        .wins-label {
            right: calc(50% + 112px);
        }

        .losses-label {
            left: calc(50% + 112px);
        }
    }
</style>
</head>

<body>

<div class="counter">

    <!-- WINS -->
    <div
        id="wins"
        class="score wins"
        title="Linksklick +1 | Rechtsklick -1"
    >
        0
    </div>

    <!-- LOSSES -->
    <div
        id="losses"
        class="score losses"
        title="Linksklick +1 | Rechtsklick -1"
    >
        0
    </div>

    <!-- ECHTES FUT CHAMPIONS LOGO -->
    <div
        id="logo"
        class="logo"
        title="Klicken = Reset"
    >
        <img
            src="assets/img/champions-only.png"
            alt="FUT Champions"
        >
    </div>

    <!-- BESCHRIFTUNGEN -->
    <div class="label wins-label">
        WINS
    </div>

    <div class="label losses-label">
        LOSSES
    </div>

</div>


<script>

(function () {

    "use strict";


    /* ==========================================
       ELEMENTE
    ========================================== */

    const winsElement =
        document.getElementById("wins");

    const lossesElement =
        document.getElementById("losses");

    const logoElement =
        document.getElementById("logo");


    /* ==========================================
       STORAGE
       
       Gleiche Namen wie im ursprünglichen
       FUT W/L Counter.
    ========================================== */

    const WINS_KEY = "wins";
    const LOSSES_KEY = "loses";


    /* ==========================================
       WERT AUS STORAGE LESEN
    ========================================== */

    function getWins() {

        let value =
            parseInt(
                localStorage.getItem(WINS_KEY) || "0",
                10
            );

        if (!Number.isFinite(value)) {
            value = 0;
        }

        if (value < 0) {
            value = 0;
        }

        return value;
    }


    function getLosses() {

        let value =
            parseInt(
                localStorage.getItem(LOSSES_KEY) || "0",
                10
            );

        if (!Number.isFinite(value)) {
            value = 0;
        }

        if (value < 0) {
            value = 0;
        }

        return value;
    }


    /* ==========================================
       ANZEIGE AKTUALISIEREN
    ========================================== */

    function render() {

        winsElement.textContent =
            getWins();

        lossesElement.textContent =
            getLosses();
    }


    /* ==========================================
       INITIALISIERUNG
    ========================================== */

    if (localStorage.getItem(WINS_KEY) === null) {
        localStorage.setItem(WINS_KEY, "0");
    }

    if (localStorage.getItem(LOSSES_KEY) === null) {
        localStorage.setItem(LOSSES_KEY, "0");
    }

    render();


    /* ==========================================
       WINS

       LINKSKLICK = +1
       RECHTSKLICK = -1
    ========================================== */

    winsElement.addEventListener(
        "click",
        function () {

            let wins = getWins();

            if (wins < 20) {
                wins++;

                localStorage.setItem(
                    WINS_KEY,
                    String(wins)
                );

                render();
            }
        }
    );


    winsElement.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

            let wins = getWins();

            if (wins > 0) {
                wins--;

                localStorage.setItem(
                    WINS_KEY,
                    String(wins)
                );

                render();
            }
        }
    );


    /* ==========================================
       LOSSES

       LINKSKLICK = +1
       RECHTSKLICK = -1
    ========================================== */

    lossesElement.addEventListener(
        "click",
        function () {

            let losses = getLosses();

            if (losses < 20) {
                losses++;

                localStorage.setItem(
                    LOSSES_KEY,
                    String(losses)
                );

                render();
            }
        }
    );


    lossesElement.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

            let losses = getLosses();

            if (losses > 0) {
                losses--;

                localStorage.setItem(
                    LOSSES_KEY,
                    String(losses)
                );

                render();
            }
        }
    );


    /* ==========================================
       LOGO

       LINKSKLICK = RESET AUF 0-0
    ========================================== */

    logoElement.addEventListener(
        "click",
        function () {

            localStorage.setItem(
                WINS_KEY,
                "0"
            );

            localStorage.setItem(
                LOSSES_KEY,
                "0"
            );

            render();
        }
    );


    /* ==========================================
       RECHTSKLICK AUF LOGO VERHINDERN
    ========================================== */

    logoElement.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();
        }
    );


    /* ==========================================
       SYNCHRONISIERUNG ZWISCHEN OBS-FENSTERN
    ========================================== */

    window.addEventListener(
        "storage",
        function (event) {

            if (
                event.key === WINS_KEY ||
                event.key === LOSSES_KEY
            ) {
                render();
            }
        }
    );


    /* ==========================================
       OBS/CEF FALLBACK

       Der Browser Source prüft regelmäßig,
       ob sich der Wert geändert hat.
    ========================================== */

    let lastWins =
        localStorage.getItem(WINS_KEY);

    let lastLosses =
        localStorage.getItem(LOSSES_KEY);


    setInterval(
        function () {

            const currentWins =
                localStorage.getItem(WINS_KEY);

            const currentLosses =
                localStorage.getItem(LOSSES_KEY);


            if (
                currentWins !== lastWins ||
                currentLosses !== lastLosses
            ) {

                lastWins =
                    currentWins;

                lastLosses =
                    currentLosses;

                render();
            }

        },
        100
    );


})();

</script>

</body>
</html>
