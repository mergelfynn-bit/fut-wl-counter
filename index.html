<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUT W/L Counter</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Lilita+One&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Lilita One', cursive;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: transparent;
}

.app {
    user-select: none;
    width: 276px;
    height: 146px;
}

.counter {
    width: 276px;
    height: 146px;

    display: flex;
    align-items: center;
    justify-content: center;

    /*
     * Originaler FUT-WL-Hintergrund
     */
    background-image: url('assets/img/bg-rect-only.png');
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
}

/*
 * WINS / LOSSES
 */
.wins,
.loses {
    width: 83px;

    color: white;

    font-size: 56px;
    line-height: 1;

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    text-shadow:
        2px 2px 3px rgba(0,0,0,.8);
}

/*
 * LOGO
 */
.mid {
    width: 110px;
    height: 146px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.champs {
    width: 110px;
    height: 146px;

    object-fit: contain;

    cursor: pointer;

    perspective: 1000px;

    animation:
        flip 10s alternate-reverse infinite ease-in-out;
}

@keyframes flip {

    0% {
        transform: rotateY(180deg);
    }

    15% {
        transform: rotateY(0deg);
    }

}


/*
 * RECHTSKLICK NICHT MARKIEREN
 */
.wins,
.loses,
.champs {
    -webkit-user-select: none;
    user-select: none;
}


/*
 * Falls OBS das Bild leicht verschiebt
 */
img {
    display: block;
}
</style>
</head>


<body>

<div class="app">

    <div class="counter">

        <!-- WINS -->
        <p
            id="wins"
            class="wins"
            title="Links +1 / Rechts -1"
        >
            0
        </p>


        <!-- FUT CHAMPIONS LOGO -->
        <div class="mid">

            <img
                id="champions"
                class="champs"
                src="assets/img/champions-only.png"
                alt="FUT Champions"
                title="Klicken = Reset"
            >

        </div>


        <!-- LOSSES -->
        <p
            id="loses"
            class="loses"
            title="Links +1 / Rechts -1"
        >
            0
        </p>

    </div>

</div>


<script>

(function () {

    "use strict";


    /*
     * =========================================
     * ELEMENTE
     * =========================================
     */

    const winsElement =
        document.getElementById("wins");

    const losesElement =
        document.getElementById("loses");

    const championsElement =
        document.getElementById("champions");


    /*
     * =========================================
     * WERTE LADEN
     *
     * EXAKT WIE IM ORIGINALPROJEKT
     * =========================================
     */

    let wins =
        parseInt(
            localStorage.getItem("wins") || "0",
            10
        );

    let loses =
        parseInt(
            localStorage.getItem("loses") || "0",
            10
        );


    if (isNaN(wins)) {
        wins = 0;
    }

    if (isNaN(loses)) {
        loses = 0;
    }


    /*
     * =========================================
     * ANZEIGE
     * =========================================
     */

    function render() {

        winsElement.textContent = wins;
        losesElement.textContent = loses;

    }


    render();


    /*
     * =========================================
     * WIN +1
     *
     * LINKSKLICK
     * =========================================
     */

    winsElement.addEventListener(
        "click",
        function () {

            if (wins >= 20) {
                return;
            }

            wins++;

            localStorage.setItem(
                "wins",
                wins
            );

            render();

        }
    );


    /*
     * =========================================
     * WIN -1
     *
     * RECHTSKLICK
     * =========================================
     */

    winsElement.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

            if (wins <= 0) {
                return;
            }

            wins--;

            localStorage.setItem(
                "wins",
                wins
            );

            render();

        }
    );


    /*
     * =========================================
     * LOSS +1
     *
     * LINKSKLICK
     * =========================================
     */

    losesElement.addEventListener(
        "click",
        function () {

            if (loses >= 20) {
                return;
            }

            loses++;

            localStorage.setItem(
                "loses",
                loses
            );

            render();

        }
    );


    /*
     * =========================================
     * LOSS -1
     *
     * RECHTSKLICK
     * =========================================
     */

    losesElement.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

            if (loses <= 0) {
                return;
            }

            loses--;

            localStorage.setItem(
                "loses",
                loses
            );

            render();

        }
    );


    /*
     * =========================================
     * LOGO
     *
     * RESET AUF 0-0
     * =========================================
     */

    championsElement.addEventListener(
        "click",
        function () {

            wins = 0;
            loses = 0;

            localStorage.setItem(
                "wins",
                0
            );

            localStorage.setItem(
                "loses",
                0
            );

            render();

        }
    );


    /*
     * =========================================
     * RECHTSKLICK AUF LOGO
     * =========================================
     */

    championsElement.addEventListener(
        "contextmenu",
        function (event) {

            event.preventDefault();

        }
    );


    /*
     * =========================================
     * OBS DOCK ↔ BROWSER SOURCE
     *
     * DAS IST DIE ORIGINAL-METHODE
     * =========================================
     */

    window.addEventListener(
        "storage",
        function (event) {

            if (
                event.key === "wins" ||
                event.key === "loses"
            ) {

                /*
                 * Werte neu aus localStorage holen
                 */
                wins =
                    parseInt(
                        localStorage.getItem("wins") || "0",
                        10
                    );

                loses =
                    parseInt(
                        localStorage.getItem("loses") || "0",
                        10
                    );

                render();

            }

        }
    );

})();

</script>

</body>
</html>
