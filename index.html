<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FUT Champions WL Counter</title>

<style>

* {
  box-sizing: border-box;
  user-select: none;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   COUNTER
========================= */

.counter {
  width: 276px;
  height: 146px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 20px;
}

/* =========================
   CONTROL DOCK
========================= */

body.control {
  background: #151515;
}

body.control .counter {
  background: #151515;
  border-radius: 12px;
}

/* =========================
   SIDES
========================= */

.side {
  width: 85px;
  height: 120px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.label {
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 3px;
}

.number {
  font-size: 58px;
  line-height: 58px;
  font-weight: 900;

  transition: transform 0.1s ease;
}

.wins .label,
.wins .number {
  color: white;
}

.losses .label,
.losses .number {
  color: white;
}

/* =========================
   LOGO
========================= */

.logo-container {
  width: 70px;
  height: 100px;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;
}

.champs-logo {
  width: 58px;
  height: 78px;

  object-fit: contain;

  display: block;

  -webkit-user-drag: none;

  transition: transform 0.1s ease;
}

/* Hover nur im Dock */

body.control .side:hover .number {
  transform: scale(1.08);
}

body.control .logo-container:hover .champs-logo {
  transform: scale(1.08);
}

/* Auf der normalen OBS-Quelle keine Maus-Effekte */

body:not(.control) .side,
body:not(.control) .logo-container {
  cursor: default;
}

</style>
</head>


<body>

<div class="counter">

  <!-- WINS -->

  <div
    class="side wins"
    id="winsButton"
  >
    <div class="label">WINS</div>
    <div
      class="number"
      id="wins"
    >0</div>
  </div>


  <!-- FUT CHAMPIONS LOGO -->

  <div
    class="logo-container"
    id="resetButton"
  >

    <img
      class="champs-logo"
      src="https://raw.githubusercontent.com/inca3/fut-wl-counter/main/public/assets/img/champions-only.png"
      alt="FUT Champions"
      draggable="false"
    >

  </div>


  <!-- LOSSES -->

  <div
    class="side losses"
    id="lossesButton"
  >
    <div class="label">LOSSES</div>
    <div
      class="number"
      id="losses"
    >0</div>
  </div>

</div>


<script>

/* ==================================================
   EINSTELLUNGEN
================================================== */

const STORAGE_KEY = "fut-wl-counter-final";

const CONTROL_MODE =
  new URLSearchParams(window.location.search).get("control") === "1";


/* ==================================================
   CONTROL-KLASSE
================================================== */

if (CONTROL_MODE) {
  document.body.classList.add("control");
}


/* ==================================================
   ELEMENTE
================================================== */

const winsElement =
  document.getElementById("wins");

const lossesElement =
  document.getElementById("losses");

const winsButton =
  document.getElementById("winsButton");

const lossesButton =
  document.getElementById("lossesButton");

const resetButton =
  document.getElementById("resetButton");


/* ==================================================
   WERTE
================================================== */

let wins = 0;
let losses = 0;


/* ==================================================
   RENDER
================================================== */

function render() {

  winsElement.textContent = wins;
  lossesElement.textContent = losses;

}


/* ==================================================
   STATE SPEICHERN
================================================== */

function saveState() {

  const state = {

    wins: wins,
    losses: losses,

    time: Date.now()

  };


  try {

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(state)
    );

  } catch (error) {

    console.log(
      "LocalStorage Fehler:",
      error
    );

  }

}


/* ==================================================
   STATE LADEN
================================================== */

function loadState() {

  try {

    const saved =
      localStorage.getItem(STORAGE_KEY);


    if (!saved) {

      render();

      return;

    }


    const state =
      JSON.parse(saved);


    if (
      typeof state.wins === "number" &&
      typeof state.losses === "number"
    ) {

      wins =
        Math.max(
          0,
          state.wins
        );

      losses =
        Math.max(
          0,
          state.losses
        );

    }


    render();

  } catch (error) {

    console.log(
      "Load Fehler:",
      error
    );

  }

}


/* ==================================================
   STATE ÄNDERN
================================================== */

function setWins(value) {

  wins =
    Math.max(
      0,
      Math.min(
        20,
        value
      )
    );

  render();

  saveState();

}


function setLosses(value) {

  losses =
    Math.max(
      0,
      Math.min(
        20,
        value
      )
    );

  render();

  saveState();

}


/* ==================================================
   WINS
================================================== */

winsButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    if (!CONTROL_MODE)
      return;

    setWins(wins + 1);

  }
);


winsButton.addEventListener(
  "contextmenu",
  function(event) {

    event.preventDefault();

    if (!CONTROL_MODE)
      return;

    setWins(wins - 1);

  }
);


/* ==================================================
   LOSSES
================================================== */

lossesButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    if (!CONTROL_MODE)
      return;

    setLosses(losses + 1);

  }
);


lossesButton.addEventListener(
  "contextmenu",
  function(event) {

    event.preventDefault();

    if (!CONTROL_MODE)
      return;

    setLosses(losses - 1);

  }
);


/* ==================================================
   RESET DURCH LOGO
================================================== */

resetButton.addEventListener(
  "click",
  function(event) {

    event.preventDefault();

    if (!CONTROL_MODE)
      return;

    setWins(0);
    setLosses(0);

  }
);


/* ==================================================
   RECHTSKLICK VERHINDERN
================================================== */

document.addEventListener(
  "contextmenu",
  function(event) {

    event.preventDefault();

  }
);


/* ==================================================
   STORAGE EVENT
   ANDERE OBS-SEITE ERHÄLT ÄNDERUNG
================================================== */

window.addEventListener(
  "storage",
  function(event) {

    if (
      event.key !== STORAGE_KEY
    ) {

      return;

    }


    loadState();

  }
);


/* ==================================================
   POLLING
   ZUSÄTZLICHE OBS-SICHERHEIT
================================================== */

let lastStorageValue = null;


function checkStorage() {

  try {

    const current =
      localStorage.getItem(
        STORAGE_KEY
      );


    if (
      current &&
      current !== lastStorageValue
    ) {

      lastStorageValue =
        current;


      const state =
        JSON.parse(current);


      if (
        typeof state.wins === "number" &&
        typeof state.losses === "number"
      ) {

        wins =
          Math.max(
            0,
            state.wins
          );

        losses =
          Math.max(
            0,
            state.losses
          );

        render();

      }

    }

  } catch (error) {

    console.log(
      "Sync Fehler:",
      error
    );

  }

}


/* ==================================================
   START
================================================== */

loadState();


try {

  lastStorageValue =
    localStorage.getItem(
      STORAGE_KEY
    );

} catch (error) {}


/* ==================================================
   ALLE 100ms NACH ÄNDERUNGEN SCHAUEN
================================================== */

setInterval(
  checkStorage,
  100
);

</script>

</body>
</html>
