<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUT Champions W/L Counter</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

body.control {
    background: #111;
}

.counter {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.score {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 72px;
    font-weight: 900;
    color: white;
    line-height: 1;
    user-select: none;
    text-shadow:
        0 3px 8px rgba(0,0,0,.9),
        0 0 12px rgba(0,0,0,.8);
    cursor: pointer;
}

.wins {
    right: calc(50% + 145px);
}

.losses {
    left: calc(50% + 145px);
}

.logo-button {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 170px;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
}

.logo-button img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
}

.control .counter {
    min-width: 520px;
}

.control .score {
    font-size: 48px;
    text-shadow: none;
}

.control .wins {
    right: calc(50% + 115px);
}

.control .losses {
    left: calc(50% + 115px);
}

.control .logo-button {
    width: 115px;
    height: 115px;
}

/* Dock-Beschriftungen */
.control .label {
    position: absolute;
    top: calc(50% - 55px);
    color: #aaa;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    pointer-events: none;
}

.control .wins-label {
    right: calc(50% + 125px);
    transform: translateX(50%);
}

.control .losses-label {
    left: calc(50% + 125px);
    transform: translateX(-50%);
}

/* Im normalen OBS-Overlay verstecken */
.label {
    display: none;
}

.control .label {
    display: block;
}
</style>
</head>

<body>

<div class="counter">

    <div class="score wins" id="wins">0</div>

    <div class="score losses" id="losses">0</div>

    <div class="logo-button" id="reset">
        <img
            src="assets/img/champions-only.png"
            alt="FUT Champions"
        >
    </div>

    <div class="label wins-label">WINS</div>
    <div class="label losses-label">LOSSES</div>

</div>

<script>
const params = new URLSearchParams(window.location.search);
const isControl = params.get("control") === "1";

if (isControl) {
    document.body.classList.add("control");
}

const STORAGE_KEY = "fut-wl-counter";

let wins = 0;
let losses = 0;

const winsEl = document.getElementById("wins");
const lossesEl = document.getElementById("losses");

function save() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            wins: wins,
            losses: losses
        })
    );
}

function load() {
    try {
        const data = JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        );

        if (data) {
            wins = Number.isFinite(Number(data.wins))
                ? Math.max(0, Number(data.wins))
                : 0;

            losses = Number.isFinite(Number(data.losses))
                ? Math.max(0, Number(data.losses))
                : 0;
        }
    } catch (e) {
        wins = 0;
        losses = 0;
    }

    render();
}

function render() {
    winsEl.textContent = wins;
    lossesEl.textContent = losses;
}

/* =========================
   NORMAL OBS OVERLAY
   ========================= */

if (!isControl) {

    load();

    /*
     * Der Overlay liest regelmäßig den aktuellen Stand.
     * Dadurch wird er aktualisiert, sobald das Dock den
     * Counter verändert.
     */
    setInterval(load, 100);

}

/* =========================
   OBS CUSTOM DOCK
   ========================= */

if (isControl) {

    load();

    /*
     * WINS
     * Linksklick = +1
     * Rechtsklick = -1
     */
    winsEl.addEventListener("click", function () {
        wins++;
        save();
        render();
    });

    winsEl.addEventListener("contextmenu", function (event) {
        event.preventDefault();

        if (wins > 0) {
            wins--;
            save();
            render();
        }
    });

    /*
     * LOSSES
     * Linksklick = +1
     * Rechtsklick = -1
     */
    lossesEl.addEventListener("click", function () {
        losses++;
        save();
        render();
    });

    lossesEl.addEventListener("contextmenu", function (event) {
        event.preventDefault();

        if (losses > 0) {
            losses--;
            save();
            render();
        }
    });

    /*
     * Logo anklicken = 0-0
     */
    document.getElementById("reset").addEventListener("click", function () {
        wins = 0;
        losses = 0;

        save();
        render();
    });

    /*
     * Rechtsklick auf Logo macht NICHTS.
     */
    document.getElementById("reset").addEventListener("contextmenu", function (event) {
        event.preventDefault();
    });

}
</script>

</body>
</html>
