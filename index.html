<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FUT Champions WL Counter</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
    }

    body.control {
      background: #111;
    }

    .counter {
      width: 276px;
      height: 146px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
    }

    body.control .counter {
      background: #181818;
      border-radius: 12px;
    }

    .side {
      width: 90px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .label {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .number {
      font-size: 58px;
      line-height: 58px;
      font-weight: 900;
    }

    .wins .label,
    .wins .number {
      color: #ffffff;
    }

    .losses .label,
    .losses .number {
      color: #e9e9e9;
    }

    .logo-container {
      width: 72px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .champs-logo {
      width: 68px;
      height: 78px;
      object-fit: contain;
      display: block;
      pointer-events: auto;
      -webkit-user-drag: none;
    }

    .side:hover .number {
      transform: scale(1.05);
    }

    .logo-container:hover .champs-logo {
      transform: scale(1.05);
    }

    .number,
    .champs-logo {
      transition: transform 0.12s ease;
    }

    body:not(.control) .side,
    body:not(.control) .logo-container {
      cursor: default;
    }
  </style>
</head>

<body>

  <div class="counter">

    <!-- WINS -->
    <div class="side wins" id="winsButton">
      <div class="label">WINS</div>
      <div class="number" id="wins">0</div>
    </div>

    <!-- ECHTES FUT CHAMPIONS LOGO -->
    <div class="logo-container" id="resetButton">
      <img
        class="champs-logo"
        src="/fut-wl-counter/assets/img/champions-only.png"
        alt="FUT Champions"
        draggable="false"
      >
    </div>

    <!-- LOSSES -->
    <div class="side losses" id="lossesButton">
      <div class="label">LOSSES</div>
      <div class="number" id="losses">0</div>
    </div>

  </div>

  <script>
    const STATE_KEY = "fut-wl-counter-state";

    let wins = 0;
    let losses = 0;

    const winsElement = document.getElementById("wins");
    const lossesElement = document.getElementById("losses");

    const winsButton = document.getElementById("winsButton");
    const lossesButton = document.getElementById("lossesButton");
    const resetButton = document.getElementById("resetButton");

    /*
      --------------------------------------------------
      CONTROL MODE
      ?control=1
      --------------------------------------------------
    */

    const params = new URLSearchParams(window.location.search);
    const isControl = params.get("control") === "1";

    if (isControl) {
      document.body.classList.add("control");
    }

    /*
      --------------------------------------------------
      BROADCAST CHANNEL
      --------------------------------------------------
    */

    let channel = null;

    if ("BroadcastChannel" in window) {
      channel = new BroadcastChannel("fut-wl-counter");
    }

    /*
      --------------------------------------------------
      RENDER
      --------------------------------------------------
    */

    function render() {
      winsElement.textContent = wins;
      lossesElement.textContent = losses;
    }

    /*
      --------------------------------------------------
      SAVE STATE
      --------------------------------------------------
    */

    function saveState() {
      const state = {
        wins: wins,
        losses: losses,
        timestamp: Date.now()
      };

      try {
        localStorage.setItem(STATE_KEY, JSON.stringify(state));
      } catch (error) {
        console.log("localStorage error:", error);
      }

      if (channel) {
        channel.postMessage({
          type: "state",
          state: state
        });
      }
    }

    /*
      --------------------------------------------------
      LOAD STATE
      --------------------------------------------------
    */

    function loadState() {
      try {
        const saved = localStorage.getItem(STATE_KEY);

        if (saved) {
          const state = JSON.parse(saved);

          if (
            typeof state.wins === "number" &&
            typeof state.losses === "number"
          ) {
            wins = state.wins;
            losses = state.losses;
            render();
          }
        }
      } catch (error) {
        console.log("load error:", error);
      }
    }

    /*
      --------------------------------------------------
      APPLY STATE
      --------------------------------------------------
    */

    function applyState(state) {
      if (!state) return;

      if (typeof state.wins === "number") {
        wins = Math.max(0, state.wins);
      }

      if (typeof state.losses === "number") {
        losses = Math.max(0, state.losses);
      }

      render();
    }

    /*
      --------------------------------------------------
      CHANNEL MESSAGES
      --------------------------------------------------
    */

    if (channel) {
      channel.onmessage = function(event) {

        if (!event.data) return;

        if (event.data.type === "state") {
          applyState(event.data.state);
        }

        if (event.data.type === "requestState") {
          channel.postMessage({
            type: "state",
            state: {
              wins: wins,
              losses: losses,
              timestamp: Date.now()
            }
          });
        }
      };
    }

    /*
      --------------------------------------------------
      LOCAL STORAGE SYNC
      --------------------------------------------------
    */

    window.addEventListener("storage", function(event) {

      if (event.key !== STATE_KEY) return;
      if (!event.newValue) return;

      try {
        const state = JSON.parse(event.newValue);
        applyState(state);
      } catch (error) {
        console.log("storage sync error:", error);
      }
    });

    /*
      --------------------------------------------------
      REQUEST CURRENT STATE
      --------------------------------------------------
    */

    function requestState() {

      if (channel) {
        channel.postMessage({
          type: "requestState"
        });
      }

      loadState();
    }

    /*
      --------------------------------------------------
      CHANGE COUNTER
      --------------------------------------------------
    */

    function changeWins(amount) {

      if (!isControl) return;

      wins += amount;

      if (wins < 0) {
        wins = 0;
      }

      render();
      saveState();
    }

    function changeLosses(amount) {

      if (!isControl) return;

      losses += amount;

      if (losses < 0) {
        losses = 0;
      }

      render();
      saveState();
    }

    /*
      --------------------------------------------------
      RESET
      --------------------------------------------------
    */

    function resetCounter() {

      if (!isControl) return;

      wins = 0;
      losses = 0;

      render();
      saveState();
    }

    /*
      --------------------------------------------------
      MOUSE CONTROLS
      --------------------------------------------------
    */

    winsButton.addEventListener("click", function(event) {
      event.preventDefault();
      changeWins(1);
    });

    winsButton.addEventListener("contextmenu", function(event) {
      event.preventDefault();
      changeWins(-1);
    });

    lossesButton.addEventListener("click", function(event) {
      event.preventDefault();
      changeLosses(1);
    });

    lossesButton.addEventListener("contextmenu", function(event) {
      event.preventDefault();
      changeLosses(-1);
    });

    resetButton.addEventListener("click", function(event) {
      event.preventDefault();
      resetCounter();
    });

    resetButton.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    /*
      --------------------------------------------------
      DISABLE RIGHT CLICK
      --------------------------------------------------
    */

    document.addEventListener("contextmenu", function(event) {
      event.preventDefault();
    });

    /*
      --------------------------------------------------
      START
      --------------------------------------------------
    */

    loadState();
    render();

    setTimeout(function() {
      requestState();
    }, 300);

  </script>

</body>
</html>
