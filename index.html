<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUT Champions WL Counter</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

.counter {
    width: 276px;
    height: 146px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;
}

.side {
    width: 65px;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.number {
    font-size: 64px;
    line-height: 1;
    font-weight: 900;
    color: white;

    text-shadow:
        0 2px 3px rgba(0,0,0,0.7);
}

.logo-container {
    width: 80px;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.champs-logo {
    width: 72px;
    height: 90px;

    object-fit: contain;

    display: block;

    -webkit-user-drag: none;
}

.number:hover,
.champs-logo:hover {
    transform: scale(1.05);
}

.number,
.champs-logo {
    transition: transform 0.1s ease;
}

/* Kein hässlicher Broken-Image-Platzhalter */
.champs-logo {
    border: none;
    outline: none;
}
</style>
</head>

<body>

<div class="counter">

    <!-- WINS -->
    <div
        class="side"
        id="winsButton"
        title="Linksklick +1 / Rechtsklick -1"
    >
        <div
            class="number"
            id="wins"
        >0</div>
    </div>


    <!-- FUT CHAMPIONS -->
    <div
        class="logo-container"
        id="resetButton"
        title="Klick = Reset"
    >
        <img
            class="champs-logo"
            src="assets/img/champions-only.png"
            alt="FUT Champions"
            draggable="false"
        >
    </div>


    <!-- LOSSES -->
    <div
        class="side"
        id="lossesButton"
        title="Linksklick +1 / Rechtsklick -1"
    >
        <div
            class="number"
            id="losses"
        >0</div>
    </div>

</div>


<script>

/* =========================================
   ELEMENTE
========================================= */

const winsElement =
    document.getElementById("wins");

const lossesElement =
    document.getElementById("losses");

const winsButton =
    document.getElementById("winsButton");

const lossesButton =
    document.getElementById("lossesButton");

const resetButton =
    document.getElementById("resetButton");


/* =========================================
   WERTE
========================================= */

let wins = 0;
let losses = 0;


/* =========================================
   LOCAL STORAGE
   Beide OBS-Fenster benutzen exakt
   denselben Speicher.
========================================= */

const WINS_KEY = "wins";
const LOSSES_KEY = "loses";


/* =========================================
   ANZEIGE
========================================= */

function render() {

    winsElement.textContent = wins;
    lossesElement.textContent = losses;

}


/* =========================================
   LADEN
========================================= */

function loadState() {

    const savedWins =
        localStorage.getItem(WINS_KEY);

    const savedLosses =
        localStorage.getItem(LOSSES_KEY);


    if (savedWins !== null) {

        wins =
            parseInt(savedWins, 10) || 0;

    }


    if (savedLosses !== null) {

        losses =
            parseInt(savedLosses, 10) || 0;

    }


    render();

}


/* =========================================
   WINS +1
========================================= */

function addWin() {

    if (wins >= 20)
        return;

    wins++;

    localStorage.setItem(
        WINS_KEY,
        wins
    );

    render();

}


/* =========================================
   WINS -1
========================================= */

function removeWin(event) {

    event.preventDefault();

    if (wins <= 0)
        return;

    wins--;

    localStorage.setItem(
        WINS_KEY,
        wins
    );

    render();

}


/* =========================================
   LOSSES +1
========================================= */

function addLoss() {

    if (losses >= 20)
        return;

    losses++;

    localStorage.setItem(
        LOSSES_KEY,
        losses
    );

    render();

}


/* =========================================
   LOSSES -1
========================================= */

function removeLoss(event) {

    event.preventDefault();

    if (losses <= 0)
        return;

    losses--;

    localStorage.setItem(
        LOSSES_KEY,
        losses
    );

    render();

}


/* =========================================
   RESET
========================================= */

function resetCounter() {

    wins = 0;
    losses = 0;

    localStorage.setItem(
        WINS_KEY,
        0
    );

    localStorage.setItem(
        LOSSES_KEY,
        0
    );

    render();

}


/* =========================================
   WINS EVENTS
========================================= */

winsButton.addEventListener(
    "click",
    addWin
);

winsButton.addEventListener(
    "contextmenu",
    removeWin
);


/* =========================================
   LOSSES EVENTS
========================================= */

lossesButton.addEventListener(
    "click",
    addLoss
);

lossesButton.addEventListener(
    "contextmenu",
    removeLoss
);


/* =========================================
   LOGO = RESET
========================================= */

resetButton.addEventListener(
    "click",
    resetCounter
);


/* =========================================
   RECHTSKLICK MENÜ DEAKTIVIEREN
========================================= */

document.addEventListener(
    "contextmenu",
    function(event) {

        event.preventDefault();

    }
);


/* =========================================
   WICHTIG:
   Wenn das andere OBS-Fenster den
   localStorage ändert, aktualisieren
   wir automatisch.
========================================= */

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key === WINS_KEY ||
            event.key === LOSSES_KEY
        ) {

            loadState();

        }

    }
);


/* =========================================
   START
========================================= */

loadState();

</script>

</body>
</html>
