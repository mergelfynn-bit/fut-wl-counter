<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUT Champions WL Counter</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   NORMAL OVERLAY
   ========================= */

.counter {
    width: 276px;
    height: 146px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;
}

.side {
    width: 65px;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.number {
    font-size: 64px;
    line-height: 1;
    font-weight: 900;
    color: white;

    text-shadow:
        0 2px 3px rgba(0,0,0,0.7);

    transition: transform 0.1s ease;
}

.logo-container {
    width: 80px;
    height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.champs-logo {
    width: 72px;
    height: 90px;

    display: block;

    background-image:
        url("https://raw.githubusercontent.com/inca3/fut-wl-counter/main/public/assets/img/champions-only.png");

    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;

    border: none;
    outline: none;

    /*
       Animation NUR im normalen Overlay
    */
    animation: championsSpin 4s linear infinite;

    transition: transform 0.1s ease;
}

@keyframes championsSpin {
    0% {
        transform: rotateY(0deg);
    }

    100% {
        transform: rotateY(360deg);
    }
}

.number:hover {
    transform: scale(1.05);
}


/* =========================
   DOCK
   ========================= */

body.dock {
    background: #181818 !important;
}

body.dock .counter {
    width: 100%;
    height: 100%;

    min-width: 300px;
    min-height: 170px;

    padding: 35px 20px 20px 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 10px;

    background: #181818;
}

body.dock .side {
    position: relative;

    width: 100px;
    height: 120px;

    flex-shrink: 0;

    border: 1px solid #444;
    border-radius: 10px;

    background: #252525;

    cursor: pointer;
}

body.dock .side:hover {
    background: #303030;
}

body.dock .number {
    font-size: 52px;
}

body.dock .logo-container {
    position: relative;

    width: 110px;
    height: 120px;

    flex-shrink: 0;

    border: 1px solid #444;
    border-radius: 10px;

    background: #202020;

    cursor: pointer;
}

body.dock .champs-logo {
    width: 75px;
    height: 95px;

    /*
       WICHTIG:
       Animation im Dock ausschalten
    */
    animation: none !important;

    transform: none !important;
}

body.dock::before {
    content: "FUT CHAMPIONS";

    position: fixed;

    top: 8px;
    left: 50%;

    transform: translateX(-50%);

    color: #aaa;

    font-size: 12px;
    font-weight: bold;

    letter-spacing: 2px;

    pointer-events: none;
}

body.dock .side::after {
    position: absolute;

    bottom: 8px;

    color: #888;

    font-size: 10px;
    font-weight: bold;

    letter-spacing: 1px;
}

body.dock .side:first-child::after {
    content: "WINS";
}

body.dock .side:last-child::after {
    content: "LOSSES";
}

body.dock .logo-container::after {
    content: "RESET";

    position: absolute;

    bottom: 8px;
    left: 0;
    right: 0;

    text-align: center;

    color: #888;

    font-size: 10px;
    font-weight: bold;

    letter-spacing: 1px;

    pointer-events: none;
}

.dock-help {
    display: none;
}

body.dock .dock-help {
    display: block;

    position: fixed;

    bottom: 2px;
    left: 50%;

    transform: translateX(-50%);

    color: #666;

    font-size: 9px;

    white-space: nowrap;

    pointer-events: none;
}


/* =========================
   KLEINES DOCK
   ========================= */

@media (max-width: 500px) {

    body.dock .counter {
        min-width: 300px;
    }

    body.dock .side {
        width: 80px;
    }

    body.dock .logo-container {
        width: 90px;
    }

    body.dock .number {
        font-size: 44px;
    }

    body.dock .champs-logo {
        width: 65px;
        height: 85px;
    }
}
</style>
</head>

<body>

<div class="counter">

    <div
        class="side"
        id="winsButton"
        title="Linksklick +1 / Rechtsklick -1"
    >
        <div class="number" id="wins">0</div>
    </div>


    <div
        class="logo-container"
        id="resetButton"
        title="Klick = Reset"
    >
        <div
            class="champs-logo"
            aria-label="FUT Champions"
        ></div>
    </div>


    <div
        class="side"
        id="lossesButton"
        title="Linksklick +1 / Rechtsklick -1"
    >
        <div class="number" id="losses">0</div>
    </div>

</div>

<div class="dock-help">
    Links = +1 &nbsp; | &nbsp; Rechts = -1 &nbsp; | &nbsp; Logo = Reset
</div>


<script>

/* =========================
   DOCK ERKENNEN
   ========================= */

const urlParams =
    new URLSearchParams(window.location.search);

const isDock =
    urlParams.get("dock") === "1";

if (isDock) {
    document.body.classList.add("dock");
}


/* =========================
   ELEMENTE
   ========================= */

const winsElement =
    document.getElementById("wins");

const lossesElement =
    document.getElementById("losses");

const winsButton =
    document.getElementById("winsButton");

const lossesButton =
    document.getElementById("lossesButton");

const resetButton =
    document.getElementById("resetButton");


/* =========================
   STORAGE
   ========================= */

const WINS_KEY = "wins";
const LOSSES_KEY = "loses";

const CHANNEL_NAME =
    "fut-wl-counter-sync";


/* =========================
   BROADCAST CHANNEL
   ========================= */

let channel = null;

try {
    channel =
        new BroadcastChannel(CHANNEL_NAME);
} catch (error) {
    channel = null;
}


/* =========================
   WERTE
   ========================= */

let wins = 0;
let losses = 0;


/* =========================
   RENDER
   ========================= */

function render() {

    winsElement.textContent =
        wins;

    lossesElement.textContent =
        losses;
}


/* =========================
   SPEICHERN
   ========================= */

function saveState() {

    const state = {
        wins: wins,
        losses: losses
    };

    localStorage.setItem(
        WINS_KEY,
        String(wins)
    );

    localStorage.setItem(
        LOSSES_KEY,
        String(losses)
    );


    if (channel) {

        try {
            channel.postMessage(state);
        } catch (error) {}

    }

    render();
}


/* =========================
   LADEN
   ========================= */

function loadState() {

    const savedWins =
        localStorage.getItem(WINS_KEY);

    const savedLosses =
        localStorage.getItem(LOSSES_KEY);


    if (savedWins !== null) {

        const value =
            parseInt(savedWins, 10);

        if (!isNaN(value)) {

            wins =
                Math.max(
                    0,
                    Math.min(20, value)
                );
        }
    }


    if (savedLosses !== null) {

        const value =
            parseInt(savedLosses, 10);

        if (!isNaN(value)) {

            losses =
                Math.max(
                    0,
                    Math.min(20, value)
                );
        }
    }


    render();
}


/* =========================
   WINS
   ========================= */

function addWin() {

    if (wins >= 20) return;

    wins++;

    saveState();
}


function removeWin(event) {

    event.preventDefault();

    if (wins <= 0) return;

    wins--;

    saveState();
}


/* =========================
   LOSSES
   ========================= */

function addLoss() {

    if (losses >= 20) return;

    losses++;

    saveState();
}


function removeLoss(event) {

    event.preventDefault();

    if (losses <= 0) return;

    losses--;

    saveState();
}


/* =========================
   RESET
   ========================= */

function resetCounter() {

    wins = 0;
    losses = 0;

    saveState();
}


/* =========================
   EVENTS
   ========================= */

winsButton.addEventListener(
    "click",
    addWin
);

winsButton.addEventListener(
    "contextmenu",
    removeWin
);


lossesButton.addEventListener(
    "click",
    addLoss
);

lossesButton.addEventListener(
    "contextmenu",
    removeLoss
);


resetButton.addEventListener(
    "click",
    resetCounter
);


/* =========================
   RECHTSKLICK VERHINDERN
   ========================= */

document.addEventListener(
    "contextmenu",
    function(event) {
        event.preventDefault();
    }
);


/* =========================
   BROADCAST EMPFANGEN
   ========================= */

if (channel) {

    channel.addEventListener(
        "message",
        function(event) {

            const data =
                event.data;

            if (!data) return;

            if (
                typeof data.wins !== "number" ||
                typeof data.losses !== "number"
            ) {
                return;
            }


            wins =
                Math.max(
                    0,
                    Math.min(20, data.wins)
                );

            losses =
                Math.max(
                    0,
                    Math.min(20, data.losses)
                );


            render();
        }
    );
}


/* =========================
   STORAGE EVENT
   ========================= */

window.addEventListener(
    "storage",
    function(event) {

        if (
            event.key === WINS_KEY ||
            event.key === LOSSES_KEY
        ) {
            loadState();
        }

    }
);


/* =========================
   POLLING
   ========================= */

let lastWins =
    localStorage.getItem(WINS_KEY);

let lastLosses =
    localStorage.getItem(LOSSES_KEY);


setInterval(
    function() {

        const currentWins =
            localStorage.getItem(WINS_KEY);

        const currentLosses =
            localStorage.getItem(LOSSES_KEY);


        if (
            currentWins !== lastWins ||
            currentLosses !== lastLosses
        ) {

            lastWins =
                currentWins;

            lastLosses =
                currentLosses;

            loadState();
        }

    },
    200
);


/* =========================
   START
   ========================= */

loadState();

</script>

</body>
</html>
